name: Auto Update EPG

on:
  schedule:
    - cron: '0 19 * * *' # 每天北京时间凌晨3点
  workflow_dispatch:      # 允许手动运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: # 赋予 Action 推送代码的权限
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      # --- 关键：恢复缓存 ---
      - name: Restore EPG Cache
        uses: actions/cache/restore@v3
        with:
          path: epg_cache.json
          key: ${{ runner.os }}-epg-cache-
          restore-keys: |
            ${{ runner.os }}-epg-cache-

      - name: Run EPG Scraper
        env:
          CHANNELS_JSON: ${{ vars.CHANNELS_JSON }}
        run: python skyperfectv_epg.py 

      # --- 关键：保存更新后的缓存 ---
      - name: Save EPG Cache
        uses: actions/cache/save@v3
        if: always() 
        with:
          path: epg_cache.json
          key: ${{ runner.os }}-epg-cache-${{ github.run_id }}

      # --- 步骤 1：发布到 Artifacts (方便手动下载) ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SPTV-EPG-Pack
          path: |
            epg_ultimate.xml.gz
            posters.zip
          retention-days: 1

      # --- 步骤 2：提交到仓库 (方便机顶盒直接 wget/git pull) ---
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 检查文件
          if [ ! -f "epg_ultimate.xml.gz" ]; then
            echo "Error: epg_ultimate.xml.gz not found!"
            exit 1
          fi

          # 建议：不要把 posters.zip commit 进仓库（文件太大且变动频繁）
          # 只 commit EPG 文件，海报通过上面的 Artifacts 下载或者放在 Release
          git add epg_ultimate.xml epg_ultimate.xml.gz

          if ! git diff --staged --quiet; then
            git commit -m "Daily EPG Update (Incremental)"
            for i in {1..3}; do
              git pull --rebase origin main && git push origin main && break || sleep 5
            done
          else
            echo "No changes to commit, skipping push."
          fi
