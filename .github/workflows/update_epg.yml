- name: Run EPG Scraper
        id: run_epg  # 添加 ID 方便后续判断
        env:
          CHANNELS_JSON: ${{ vars.CHANNELS_JSON }}
        run: |
          python skyperfectv_epg.py
          # 确保脚本运行后，本地已经存在 posters.zip

      - name: Process Posters (Standardize)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FURY_ID: ${{ vars.FURY_ID }} 
        run: |
          # 优先使用本次脚本新生成的 zip，如果没有才尝试下载旧的（保底策略）
          if [ ! -f "posters.zip" ]; then
            echo "⚠️ 本次运行未生成新的 posters.zip，尝试下载旧版本..."
            gh release download latest -p "posters.zip" --clobber || echo "No posters.zip found"
          fi
          
          if [ -f "posters.zip" ]; then
            mkdir -p posters_raw posters_final
            unzip -o posters.zip -d posters_raw/
            
            # 运行你的标准化处理脚本
            python process_posters.py
            
            if [ -d "posters_final" ] && [ "$(ls -A posters_final 2>/dev/null)" ]; then
              cd posters_final && zip -rq ../fury_posters.zip ./* && cd ..
              echo "✅ fury_posters.zip created."
            else
              echo "❌ 警告：posters_final 为空，请检查 process_posters.py 的逻辑"
            fi
          else
            echo "❌ 错误：找不到任何 posters.zip，跳过处理步骤"
          fi

      - name: Update Release
        uses: softprops/action-gh-release@v2 # 建议升级到 v2
        with:
          tag_name: latest
          files: |
            epg_ultimate.xml.gz
            posters.zip
            fury_posters.zip
          # 设置为 true 会覆盖同名文件，适合 "latest" 标签
          overwrite: true 
          body: |
            每日自动更新 SPTV 海报与 EPG
            更新时间: ${{ github.event.head_commit.timestamp || 'Manual Trigger' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
