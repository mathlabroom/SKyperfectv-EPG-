name: Auto Update EPG & Standardize Posters

on:
  schedule:
    - cron: '0 19 * * *' # 北京时间凌晨 3:00
  workflow_dispatch:      # 允许手动触发测试

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml Pillow

      - name: Restore EPG Cache
        uses: actions/cache/restore@v3
        with:
          path: epg_cache.json
          key: ${{ runner.os }}-epg-cache-
          restore-keys: |
            ${{ runner.os }}-epg-cache-

      # 新增：获取北京时间并存入环境变量，供后续所有步骤使用
      - name: Get Beijing Time
        run: echo "BJ_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Clear old posters
        run: |
          mkdir -p posters_raw posters_final # 确保文件夹存在，防止 rm 报错
          rm -rf posters_raw/*
          rm -rf posters_final/*
          
      - name: Run EPG Scraper & Download Original Posters
        id: scraper
        env:
          CHANNELS_JSON: ${{ vars.CHANNELS_JSON }}
        run: |
          python skyperfectv_epg.py
          if [ -f "posters.zip" ]; then
            echo "HAS_ORIGINAL=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_ORIGINAL=false" >> $GITHUB_OUTPUT
            echo "⚠️ Warning: posters.zip not found."
          fi

      - name: Process Posters for Fury
        if: steps.scraper.outputs.HAS_ORIGINAL == 'true'
        env:
          FURY_ID: ${{ vars.FURY_ID }}
        run: |
          mkdir -p posters_raw posters_final
          unzip -q -o posters.zip -d posters_raw/
          python process_posters.py
          if [ -d "posters_final" ] && [ "$(ls -A posters_final 2>/dev/null)" ]; then
            cd posters_final && zip -rq ../fury_posters.zip ./* && cd ..
            echo "✅ fury_posters.zip created."
          else
            # 如果没新图，创建一个空文件占位，防止后面上传步骤报错
            echo "⚠️ 本次运行没有新海报，生成占位包"
            touch posters_final/placeholder.txt
            zip -rq fury_posters.zip posters_final/placeholder.txt
          fi

      - name: Save EPG Cache
        uses: actions/cache/save@v3
        if: always()
        with:
          path: epg_cache.json
          key: ${{ runner.os }}-epg-cache-${{ github.run_id }}

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          # 🚩 关键新增：强制将标签指向当前的 Commit 节点
          target_commitish: ${{ github.sha }} 
          name: "Latest SPTV EPG & Posters"
          # 🚩 关键新增：强制更新现有的标签
          force_update: true 
          files: |
            epg_ultimate.xml.gz
            epg_ultimate.xml
            posters.zip
            fury_posters.zip
          body: |
            ### 自动更新报告
            - **更新时间**: ${{ env.BJ_TIME }} (北京时间)
            - **包含内容**: 原始海报、Fury 适配版海报及最新 EPG 压缩包。
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip Git Push
        run: |
          echo "✅ 任务执行完毕"
          echo "📦 原始 XML 和 GZ 压缩包已准备就绪"
          echo "🖼️ 节目海报已打包完成"
          echo "🚀 所有产物已上传至 Release 页面，跳过仓库推送以保持 Git 干净。"

      - name: Upload Artifacts (Internal Debug)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-files
          path: |
            posters.zip
            fury_posters.zip
          retention-days: 1
