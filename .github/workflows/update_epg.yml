name: Auto Update EPG

on:
  schedule:
    - cron: '0 21 * * *' # 每天北京时间凌晨5点运行
  workflow_dispatch:      # 允许手动点击运行按钮

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run EPG Scraper
        run: python skyperfectv_epg.py  # 确保文件名与你的脚本名一致

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 检查文件是否存在，防止 git add 报错
          if [ -f "epg_ultimate.xml" ]; then
            git add epg_ultimate.xml epg_ultimate.xml.gz
            git commit -m "Daily EPG Update" || exit 0
            git push
          else
            echo "Error: epg_ultimate.xml not found!"
            exit 1
          fi
