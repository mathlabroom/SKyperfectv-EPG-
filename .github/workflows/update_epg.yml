name: Auto Update EPG & Standardize Posters

on:
  schedule:
    - cron: '0 21 * * *' # 北京时间凌晨 5:00
  workflow_dispatch:      # 允许手动触发测试

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml Pillow

      - name: Restore EPG Cache
        uses: actions/cache/restore@v3
        with:
          path: epg_cache.json
          key: ${{ runner.os }}-epg-cache-
          restore-keys: |
            ${{ runner.os }}-epg-cache-

      - name: Get Beijing Time
        run: echo "BJ_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Clear old posters
        run: |
          mkdir -p posters_raw posters_final
          rm -rf posters_raw/*
          rm -rf posters_final/*
          
      - name: Run EPG Scraper & Download Original Posters
        id: scraper
        env:
          CHANNELS_JSON: ${{ vars.CHANNELS_JSON }}
        run: |
          python skyperfectv_epg.py
          if [ -f "posters.zip" ]; then
            echo "HAS_ORIGINAL=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_ORIGINAL=false" >> $GITHUB_OUTPUT
          fi

      - name: Process Posters for Fury
        if: steps.scraper.outputs.HAS_ORIGINAL == 'true'
        env:
          FURY_ID: ${{ vars.FURY_ID }}
        run: |
          # 1. 解压原始海报
          mkdir -p posters_raw posters_final
          unzip -q -o posters.zip -d posters_raw/
          
          # 2. 运行 Python 脚本（MD5 + Hard Link 版）
          python process_posters.py
          
          # 3. 使用 tar 保持硬链接打包
          if [ -d "posters_final" ] && [ "$(ls -A posters_final 2>/dev/null)" ]; then
            echo "🚀 正在打包 fury_posters.tar.gz (保留物理硬链接)..."
            # -C 切换目录打包，确保解压后直接是图片文件
            tar -czvf fury_posters.tar.gz -C posters_final .
            echo "✅ fury_posters.tar.gz 已生成。"
          fi

      - name: Check Package Size
        if: steps.scraper.outputs.HAS_ORIGINAL == 'true'
        run: |
          echo "=== 体积对比报告 ==="
          [ -f "posters.zip" ] && echo "📦 原始 ZIP 大小: $(du -sh posters.zip | cut -f1)"
          [ -f "fury_posters.tar.gz" ] && echo "📦 Fury (Hard Link) tar.gz 大小: $(du -sh fury_posters.tar.gz | cut -f1)"
          echo "=================="

      - name: Save EPG Cache
        uses: actions/cache/save@v3
        if: always()
        with:
          path: epg_cache.json
          key: ${{ runner.os }}-epg-cache-${{ github.run_id }}

# 第一步：物理删除旧的 Release 和 Tag (确保源码包重置)
      - name: Delete old release and tag
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 第二步：发布全新的 Release
      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }} 
          name: "Latest SPTV EPG & Posters"
          files: |
            epg_ultimate.xml.gz
            epg_ultimate.xml
            posters.zip
            fury_posters.tar.gz
          body: |
            ### 自动更新报告
            - **更新时间**: ${{ env.BJ_TIME }} (北京时间)
            - **特别说明**: `fury_posters.tar.gz` 采用了硬链接技术，推荐在支持 tar 的机顶盒上使用以节省空间。
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Internal Debug)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-files
          path: |
            posters.zip
            fury_posters.tar.gz
          retention-days: 1

      - name: "Upload All JSON for Me"
        uses: actions/upload-artifact@v4
        with:
          name: epg-cache-files
          path: "**/*.json"
