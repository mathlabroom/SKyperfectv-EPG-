name: Auto Update EPG & Standardize Posters

on:
  schedule:
    - cron: '0 19 * * *' # 北京时间凌晨 3:00
  workflow_dispatch:      # 允许手动触发测试

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml Pillow

      - name: Restore EPG Cache
        uses: actions/cache/restore@v3
        with:
          path: epg_cache.json
          key: ${{ runner.os }}-epg-cache-
          restore-keys: |
            ${{ runner.os }}-epg-cache-

      # 新增：获取北京时间并存入环境变量，供后续所有步骤使用
      - name: Get Beijing Time
        run: echo "BJ_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Run EPG Scraper & Download Original Posters
        id: scraper
        env:
          CHANNELS_JSON: ${{ vars.CHANNELS_JSON }}
        run: |
          python skyperfectv_epg.py
          if [ -f "posters.zip" ]; then
            echo "HAS_ORIGINAL=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_ORIGINAL=false" >> $GITHUB_OUTPUT
            echo "⚠️ Warning: posters.zip not found."
          fi

      - name: Process Posters for Fury
        if: steps.scraper.outputs.HAS_ORIGINAL == 'true'
        env:
          FURY_ID: ${{ vars.FURY_ID }}
        run: |
          mkdir -p posters_raw posters_final
          unzip -q -o posters.zip -d posters_raw/
          python process_posters.py
          if [ -d "posters_final" ] && [ "$(ls -A posters_final 2>/dev/null)" ]; then
            cd posters_final && zip -rq ../fury_posters.zip ./* && cd ..
            echo "✅ fury_posters.zip created."
          else
            echo "❌ Error: posters_final is empty."
            exit 1
          fi

      - name: Save EPG Cache
        uses: actions/cache/save@v3
        if: always()
        with:
          path: epg_cache.json
          key: ${{ runner.os }}-epg-cache-${{ github.run_id }}

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest SPTV EPG & Posters"
          files: |
            epg_ultimate.xml.gz
            epg_ultimate.xml
            posters.zip
            fury_posters.zip
          # 使用 ${{ env.BJ_TIME }} 替换之前的 $(date) 源码
          body: |
            ### 自动更新报告
            - **更新时间**: ${{ env.BJ_TIME }} (北京时间)
            - **包含内容**: 原始海报、Fury 适配版海报及最新 EPG 压缩包。
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Git Push Metadata
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 🚩 核心修改：把 xml 和 gz 都添加进来
          [ -f "epg_ultimate.xml" ] && git add epg_ultimate.xml
          [ -f "epg_ultimate.xml.gz" ] && git add epg_ultimate.xml.gz
          
          # 检查是否有文件变更
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto update EPG data ${{ env.BJ_TIME }}"
            for i in {1..5}; do
              # 自动拉取远程更改防止冲突
              git pull --rebase origin main
              git push origin main && break || sleep 10
            done
          else
            echo "✅ 数据未发生变化，无需推送仓库。"
          fi

      - name: Upload Artifacts (Internal Debug)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-files
          path: |
            posters.zip
            fury_posters.zip
          retention-days: 1
