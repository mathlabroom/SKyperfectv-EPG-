name: Auto Update EPG

on:
  schedule:
    - cron: '0 19 * * *' # 每天北京时间凌晨3点运行（19:00 UTC）
  workflow_dispatch:      # 允许手动点击运行按钮

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      # --- 关键：恢复缓存 ---
      - name: Restore EPG Cache
        uses: actions/cache/restore@v3
        with:
          path: epg_cache.json
          # 使用固定的 key 前缀，尝试匹配最近的一次缓存
          key: ${{ runner.os }}-epg-cache-
          restore-keys: |
            ${{ runner.os }}-epg-cache-

      - name: Run EPG Scraper
        # ！！！注意：这里确保文件名和你仓库里的 python 文件名完全一致 ！！！
        run: python skyperfectv_epg.py 

      # --- 关键：保存更新后的缓存 ---
      - name: Save EPG Cache
        uses: actions/cache/save@v3
        if: always() # 确保即使脚本部分报错也能保存已抓取的缓存
        with:
          path: epg_cache.json
          # 使用 run_id 确保每次运行都能生成一个新的缓存节点
          key: ${{ runner.os }}-epg-cache-${{ github.run_id }}

      - name: Commit and Push
        run: |
          # 1. 配置 Git 信息
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 2. 检查关键文件是否存在
          if [ ! -f "epg_ultimate.xml" ]; then
            echo "Error: epg_ultimate.xml not found!"
            exit 1
          fi

          # 3. 添加所有更改（包含 .xml 和 .gz）
          git add epg_ultimate.xml epg_ultimate.xml.gz

          # 4. 只有在有变动时才进行后续操作
          if ! git diff --staged --quiet; then
            git commit -m "Daily EPG Update (Incremental)"
            
            # 5. 使用 rebase 解决远程冲突，并推送到 main
            # 如果 push 失败，尝试重试 3 次，增加稳定性
            for i in {1..3}; do
              git pull --rebase origin main && git push origin main && break || sleep 5
            done
          else
            echo "No changes to commit, skipping push."
          fi
