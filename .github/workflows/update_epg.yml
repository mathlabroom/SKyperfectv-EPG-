name: Update Japan EPG

on:
  schedule:
    - cron: '0 18 * * *' # 每天北京时间凌晨2点运行
  workflow_dispatch:      # 允许手动触发
  
  permissions:  # <--- 增加这一段
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # 解决你的 Node.js 20 警告
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 升级到 v4

      - name: Set up Python
        uses: actions/setup-python@v5 # 升级到 v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml  # 增加 lxml 提高解析效率

      - name: Run Scraper
        run: python skyperfectv_epg.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg_ultimate.xml || echo "No changes to commit"
          git commit -m "Update EPG: $(date)" || echo "No changes to commit"
          git push || echo "Push failed"
