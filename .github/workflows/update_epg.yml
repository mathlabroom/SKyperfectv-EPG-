name: Auto Update EPG

on:
  schedule:
    - cron: '0 19 * * *' # 每天北京时间凌晨3点
  workflow_dispatch:      # 允许手动运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须：允许推送代码和创建 Release
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      # --- 恢复缓存 ---
      - name: Restore EPG Cache
        uses: actions/cache/restore@v3
        with:
          path: epg_cache.json
          key: ${{ runner.os }}-epg-cache-
          restore-keys: |
            ${{ runner.os }}-epg-cache-

      # --- 运行爬虫 ---
      - name: Run EPG Scraper
        env:
          CHANNELS_JSON: ${{ vars.CHANNELS_JSON }}
        run: python skyperfectv_epg.py

      # --- 保存缓存 (放在脚本运行后) ---
      - name: Save EPG Cache
        uses: actions/cache/save@v3
        if: always() 
        with:
          path: epg_cache.json
          key: ${{ runner.os }}-epg-cache-${{ github.run_id }}

      # --- 步骤 1：更新 Release (提供固定下载链接) ---
      - name: Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          files: |
            epg_ultimate.xml.gz
            posters.zip
          body: "每日自动更新 SPTV 海报与 EPG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 步骤 2：提交 EPG 到仓库 (可选) ---
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -f "epg_ultimate.xml.gz" ]; then
            git add epg_ultimate.xml epg_ultimate.xml.gz
            if ! git diff --staged --quiet; then
              git commit -m "Daily EPG Update (Incremental)"
              for i in {1..3}; do
                git pull --rebase origin main && git push origin main && break || sleep 5
              done
            fi
          fi

      # --- 步骤 3：发布 Artifacts (备份) ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SPTV-EPG-Pack
          path: |
            epg_ultimate.xml.gz
            posters.zip
          retention-days: 1
