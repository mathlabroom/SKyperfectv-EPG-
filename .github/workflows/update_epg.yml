name: Auto Update EPG & Standardize Posters

on:
  schedule:
    - cron: '0 19 * * *' # 每天北京时间凌晨3点
  workflow_dispatch:      # 允许手动运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- 1. 安装所有依赖 (在这里加入 Pillow) ---
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml Pillow

      # --- 恢复 EPG 缓存 ---
      - name: Restore EPG Cache
        uses: actions/cache/restore@v3
        with:
          path: epg_cache.json
          key: ${{ runner.os }}-epg-cache-
          restore-keys: |
            ${{ runner.os }}-epg-cache-

      # --- 2. 运行 EPG 爬虫 ---
      - name: Run EPG Scraper
        env:
          CHANNELS_JSON: ${{ vars.CHANNELS_JSON }}
        run: python skyperfectv_epg.py

      # --- 3. 处理海报 (利用已安装的 Pillow) ---
      - name: Download & Process Posters
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A. 从最新 Release 下载原始 posters.zip
          gh release download latest -p "posters.zip" --clobber || echo "No posters.zip found in release"
          
          if [ -f "posters.zip" ]; then
            # B. 准备文件夹
            mkdir -p posters_raw
            mkdir -p posters_final
            unzip -o posters.zip -d posters_raw/
            
            # C. 运行清洗与图片处理脚本
            python process_posters.py
            
            # D. 打包 (增加检查防止空包)
            if [ -d "posters_final" ]; then
              cd posters_final
              zip -r ../fury_posters.zip ./*
              cd ..
            fi
          else
            echo "Skipping poster processing as posters.zip is missing."
          fi

      # --- 保存 EPG 缓存 ---
      - name: Save EPG Cache
        uses: actions/cache/save@v3
        if: always() 
        with:
          path: epg_cache.json
          key: ${{ runner.os }}-epg-cache-${{ github.run_id }}

      # --- 4. 更新 Release (分发 epg_ultimate.xml.gz, posters.zip, fury_posters.zip) ---
      - name: Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          files: |
            epg_ultimate.xml.gz
            posters.zip
            fury_posters.zip
          body: "每日自动更新 SPTV 海报 (包含 Fury 适配版) 与 EPG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 5. 提交 EPG 到仓库 (可选) ---
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if [ -f "epg_ultimate.xml.gz" ]; then
            git add epg_ultimate.xml epg_ultimate.xml.gz
            if ! git diff --staged --quiet; then
              git commit -m "Daily EPG Update (Incremental)"
              for i in {1..3}; do
                git pull --rebase origin main && git push origin main && break || sleep 5
              done
            fi
          fi

      # --- 6. 发布 Artifacts (备份) ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SPTV-EPG-Pack
          path: |
            epg_ultimate.xml.gz
            posters.zip
            fury_posters.zip
          retention-days: 1
