name: Auto Update EPG

on:
  schedule:
    - cron: '0 21 * * *' # 每天北京时间凌晨5点运行
  workflow_dispatch:      # 允许你手动点击运行按钮

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Script
        run: python your_script_name.py # ⚠️这里换成你Python文件的实际名字

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 把 xml 和 gz 都加入暂存区
          git add epg_ultimate.xml epg_ultimate.xml.gz
          git commit -m "Daily EPG Update" || exit 0
          git push
